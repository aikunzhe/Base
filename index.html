<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自提点介绍</title>
    <style>
        :root {
            --primary-color: #07c160;
            /* WeChat Green for familiarity */
            --secondary-color: #1989fa;
            /* Blue for contrast */
            --bg-color: #f7f8fa;
            --text-color: #333;
            --card-bg: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 12px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            /* Mobile width cap */
            padding: 24px 16px;
            box-sizing: border-box;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Image Section */
        .image-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .image-card h2 {
            margin: 0 0 16px 0;
            font-size: 18px;
            font-weight: 600;
            color: #555;
        }

        .qr-image {
            width: 100%;
            max-width: 300px;
            /* Limit image size as requested */
            height: auto;
            border-radius: 8px;
            /* Optional: visual border to frame the QR code */
            border: 1px solid #eee;
        }

        .refresh-tip {
            margin-top: 10px;
            font-size: 12px;
            color: #999;
        }

        /* Contact Section */
        .contact-section {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            margin: 0 0 8px 0;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            box-sizing: border-box;
            border-radius: 50px;
            /* Pill shape */
            text-decoration: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.1s active, opacity 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .contact-btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #05a350);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary-color), #0f70d6);
        }

        .icon {
            margin-right: 8px;
            font-size: 20px;
            /* Simple representation of a phone icon */
        }
    </style>
</head>

<body>

    <div class="container">


        <!-- ：打电话区域 -->
        <div class="contact-section">
            <h3 class="section-title">联系我们</h3>

            <a href="tel:15626198780" class="contact-btn btn-primary">
                <span class="icon">📞</span>
                点击联系团长
            </a>

            <a href="tel:15914493483" class="contact-btn btn-secondary">
                <span class="icon">☎️</span>
                点击联系副团长
            </a>
        </div>


        <!-- ：微信群二维码 -->
        <div class="image-card">
            <h2>欢迎加入自提点群聊</h2>
            <!-- 引入图片带上 ?=1 版本信息，并限制大小 -->
            <img src="wechatgroup.jpg?=1" alt="微信群二维码" class="qr-image">
            <div class="refresh-tip">长按识别二维码</div>
        </div>
    </div>

</body>

</html>
